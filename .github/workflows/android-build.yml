
name: Go Karabakh Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build React application
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # Cache downloaded Gradle dependencies between builds.
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Retry temporary Maven Central rate-limit failures.
      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew

          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt of 3"

            if ./gradlew assembleDebug; then
              echo "APK build successful!"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              WAIT_TIME=$((attempt * 20))
              echo "Build failed. Waiting ${WAIT_TIME} seconds before retry..."
              sleep "$WAIT_TIME"
            fi
          done

          echo "All Gradle build attempts failed."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: go-karabakh-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
